name: frontend

on:
  push:
    paths:
    - ".github/workflows/frontend.yml"
    - "html/**"
    - "src/html.h"
  pull_request:
    paths:
    - ".github/workflows/frontend.yml"
    - "html/**"
    - "src/html.h"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Run yarn install, check, build and tests
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn install --immutable
          yarn run check
          yarn run build
          git diff --exit-code -- ../src/html.h
          yarn playwright install --with-deps chromium
          yarn run test
        working-directory: html
